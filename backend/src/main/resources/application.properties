spring.application.name=unievents-backend
spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# UniEvents Bounded Worker Pool (Member 5 - ExecutorService)
unievents.executor.core-pool-size=${EXECUTOR_CORE_POOL_SIZE:10}
unievents.executor.max-pool-size=${EXECUTOR_MAX_POOL_SIZE:20}
unievents.executor.queue-capacity=${EXECUTOR_QUEUE_CAPACITY:50}
unievents.executor.keep-alive-seconds=${EXECUTOR_KEEP_ALIVE_SECONDS:60}
unievents.executor.shutdown-timeout-seconds=${EXECUTOR_SHUTDOWN_TIMEOUT_SECONDS:10}
unievents.executor.thread-prefix=unievents-worker-

