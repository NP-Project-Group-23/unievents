spring.datasource.url=jdbc:h2:file:${LOCAL_DB_PATH:./data/unievents};MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
server.port=${SERVER_PORT:8080}
unievents.tcp.enabled=true
unievents.tcp.bind-address=${TCP_BIND_ADDRESS:127.0.0.1}
unievents.tcp.port=${TCP_PORT:9090}
