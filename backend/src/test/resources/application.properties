# Spring integration contexts use independent ephemeral TCP listeners.
unievents.tcp.port=0
spring.application.name=unievents-backend-test
spring.datasource.url=jdbc:h2:mem:default-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.flyway.enabled=false
